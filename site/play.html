<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meanwaile Game Room</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="nav-wrap">
    <nav class="nav-card">
      <div class="nav-brand">
        <a href="https://www.meanwaile.com" target="_blank" rel="noopener">
          <span class="nav-icon">&gt;_</span>
          <span class="nav-brand-name">meanwaile</span>
        </a>
        <span class="nav-brand-sep">/</span>
        <a href="index.html">Game Room</a>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="https://meanwaile.com" target="_blank" rel="noopener">About Meanwaile</a>
        <a class="nav-link" href="https://github.com/uurien/meanwaile-games" target="_blank" rel="noopener">GitHub</a>
      </div>
    </nav>
  </div>

  <div class="wrap">
    <a class="back-link" href="index.html">&larr; All games</a>

    <div id="content">
      <div class="empty-state">Loading&hellip;</div>
    </div>
  </div>

  <script type="module">
    import { metaFor } from './meta.js';

    const content = document.getElementById('content');
    const id = new URLSearchParams(window.location.search).get('id');

    function renderError(message) {
      content.innerHTML = `<div class="empty-state">${message}</div>`;
    }

    async function init() {
      if (!id) {
        renderError('No game selected.');
        return;
      }

      const collectionRes = await fetch('collection.json');
      const collection = await collectionRes.json();
      const entry = collection.games.find((g) => g.id === id);
      if (!entry) {
        renderError('Game not found.');
        return;
      }

      const manifestRes = await fetch(`games/${id}/game.json`);
      if (!manifestRes.ok) {
        renderError('Game not found.');
        return;
      }
      const game = await manifestRes.json();
      const meta = metaFor(id);

      document.title = `${game.name} — Meanwaile Game Room`;

      content.innerHTML = `
        <div class="play-layout">
          <div class="stage-card">
            <div class="stage">
              <iframe id="game-frame" src="games/${id}/${game.entry}" title="${game.name}"></iframe>
              <div class="stage-overlay" id="stage-overlay">
                <button class="play-overlay-btn" id="play-btn" type="button">Play!</button>
              </div>
            </div>
          </div>
          <div class="info-panel">
            <h1>${game.name}</h1>
            <p class="info-panel-desc">${game.description || game.tagline || ''}</p>
            <div class="tags">
              <span class="tag">${meta.tag}</span>
            </div>
            <hr class="info-divider" />
            <div class="info-heading">Controls</div>
            <div class="controls-box">${meta.controls}</div>
            ${meta.desktopOnly ? '<div class="desktop-note">&#128421; Desktop only</div>' : ''}
          </div>
        </div>
      `;

      const overlay = document.getElementById('stage-overlay');
      const playBtn = document.getElementById('play-btn');
      const frame = document.getElementById('game-frame');
      let started = false;

      function pause() {
        if (!started) return;
        frame.contentWindow?.postMessage({ type: 'game:pause' }, window.location.origin);
        overlay.classList.remove('is-hidden');
      }

      function resume() {
        started = true;
        overlay.classList.add('is-hidden');
        frame.contentWindow?.postMessage({ type: 'game:resume' }, window.location.origin);
        frame.contentWindow?.focus();
      }

      playBtn.addEventListener('click', resume);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) resume();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) pause();
      });
      window.addEventListener('pagehide', pause);
    }

    init();
  </script>
</body>
</html>
