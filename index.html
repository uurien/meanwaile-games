<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>meanwaile-games — collection tester</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      background: #151515;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #sidebar {
      width: 260px;
      flex: none;
      overflow-y: auto;
      border-right: 1px solid #2a2a2a;
      padding: 12px;
    }

    #sidebar h1 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #999;
    }

    .game-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .game-card:hover {
      background: #1f1f1f;
    }

    .game-card.selected {
      background: #232323;
      border-color: #4caf50;
    }

    .game-card img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      background: #333;
    }

    .game-card .meta {
      min-width: 0;
    }

    .game-card .name {
      font-size: 13px;
      font-weight: 600;
    }

    .game-card .tagline {
      font-size: 11px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      overflow: auto;
    }

    #details {
      max-width: 440px;
      text-align: center;
    }

    #details h2 {
      font-size: 16px;
    }

    #details p {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    #pause-btn {
      margin-top: 10px;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #444;
      background: transparent;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
    }

    #pause-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #stage {
      position: relative;
      width: 440px;
      height: 470px;
      max-width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    #stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.85);
      cursor: pointer;
    }

    #overlay[hidden] {
      display: none;
    }

    #overlay button {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      background: #4caf50;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    #empty {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>Games in collection.json</h1>
    <div id="game-list"></div>
  </div>

  <div id="main">
    <div id="empty">Select a game from the list.</div>
    <div id="details" hidden>
      <h2 id="details-name"></h2>
      <p id="details-description"></p>
      <button id="pause-btn">Pause</button>
    </div>
    <div id="stage" hidden>
      <iframe id="game-frame"></iframe>
      <div id="overlay">
        <span id="overlay-msg">Ready to play?</span>
        <button id="overlay-btn">Start</button>
      </div>
    </div>
  </div>

  <script type="module">
    const listEl = document.getElementById('game-list');
    const emptyEl = document.getElementById('empty');
    const detailsEl = document.getElementById('details');
    const detailsNameEl = document.getElementById('details-name');
    const detailsDescriptionEl = document.getElementById('details-description');
    const stageEl = document.getElementById('stage');
    const frameEl = document.getElementById('game-frame');
    const overlayEl = document.getElementById('overlay');
    const overlayMsgEl = document.getElementById('overlay-msg');
    const overlayBtnEl = document.getElementById('overlay-btn');
    const pauseBtnEl = document.getElementById('pause-btn');

    let current = null;
    let started = false;
    let paused = true;

    function pauseCurrent() {
      if (!current || paused) return;
      frameEl.contentWindow?.postMessage({ type: 'game:pause' }, '*');
      paused = true;
      overlayMsgEl.textContent = started ? 'Paused' : 'Ready to play?';
      overlayBtnEl.textContent = started ? 'Continue' : 'Start';
      overlayEl.hidden = false;
      pauseBtnEl.disabled = true;
    }

    function resumeCurrent() {
      if (!current) return;
      started = true;
      paused = false;
      overlayEl.hidden = true;
      pauseBtnEl.disabled = false;
      frameEl.contentWindow?.postMessage({ type: 'game:resume' }, '*');
    }

    overlayBtnEl.addEventListener('click', resumeCurrent);
    pauseBtnEl.addEventListener('click', pauseCurrent);

    async function loadGame(game) {
      pauseCurrent();
      current = game;
      started = false;
      paused = true;

      document
        .querySelectorAll('.game-card')
        .forEach((card) => card.classList.toggle('selected', card.dataset.id === game.id));

      emptyEl.hidden = true;
      detailsEl.hidden = false;
      stageEl.hidden = false;

      detailsNameEl.textContent = game.name;
      detailsDescriptionEl.textContent = game.description || game.tagline || '';

      overlayMsgEl.textContent = 'Ready to play?';
      overlayBtnEl.textContent = 'Start';
      overlayEl.hidden = false;
      pauseBtnEl.disabled = true;

      frameEl.src = `${game.path}/${game.entry}`;
    }

    async function loadManifest(path) {
      const res = await fetch(`${path}/game.json`);
      if (!res.ok) throw new Error(`Failed to load ${path}/game.json (${res.status})`);
      const manifest = await res.json();
      return { ...manifest, path };
    }

    async function init() {
      const res = await fetch('collection.json');
      const collection = await res.json();

      const games = await Promise.all(
        collection.games.map((entry) =>
          loadManifest(entry.path).catch((err) => {
            console.error(err);
            return null;
          })
        )
      );

      for (const game of games) {
        if (!game) continue;

        const card = document.createElement('div');
        card.className = 'game-card';
        card.dataset.id = game.id;

        const img = document.createElement('img');
        img.src = `${game.path}/${game.preview}`;
        img.alt = '';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = game.name;

        const tagline = document.createElement('div');
        tagline.className = 'tagline';
        tagline.textContent = game.tagline;

        meta.append(name, tagline);
        card.append(img, meta);
        card.addEventListener('click', () => loadGame(game));

        listEl.appendChild(card);
      }
    }

    init();
  </script>
</body>
</html>
